
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explainer | PeerLearn</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header>
        <h2>🎓 PeerLearn</h2>
        <nav>
            <a href="../index.html">Home</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Become an Explainer 🧑‍🏫</h1>
        <p>Share your knowledge and help other students learn.</p>
    </section>

    <section id="roles">
        <h2>Create a Learning Session</h2>

        <form id="sessionForm" class="card">
            <label for="explainerName">Your Name</label><br>
            <input type="text" id="explainerName"
                   placeholder="Enter your name" required>
            <br><br>

            <label for="subject">Subject</label><br>
            <input type="text" id="subject"
                   placeholder="e.g. Java, Mathematics" required>
            <br><br>

            <label for="topic">Topic</label><br>
            <input type="text" id="topic"
                   placeholder="What will you teach?" required>
            <br><br>

            <label for="sessionDate">Session Date</label><br>
            <input type="date" id="sessionDate" required>
            <br><br>

            <label for="sessionTime">Session Time</label><br>
            <input type="time" id="sessionTime" required>
            <br><br>

            <label for="duration">Duration</label><br>
            <select id="duration" required>
                <option value="15">15 minutes</option>
                <option value="30">30 minutes</option>
                <option value="45">45 minutes</option>
                <option value="60">60 minutes</option>
            </select>
            <br><br>

            <label for="capacity">Maximum Listeners</label><br>
            <input type="number" id="capacity"
                   min="1" max="50" value="5" required>
            <br><br>

            <button type="submit" class="btn">
                Create Session
            </button>
        </form>

        <p id="message"></p>
    </section>

    <script src="../script.js"></script>
</body>
</html>
